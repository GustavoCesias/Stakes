<div class="min-h-screen bg-[#0B0F19] flex items-center justify-center p-4 relative overflow-hidden font-sans">
  
  <!-- Glowing Background Orbs -->
  <div class="absolute top-1/4 left-1/3 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/3 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none animate-pulse" style="animation-delay: 2s;"></div>

  <!-- Login Glass Card -->
  <div class="w-full max-w-md bg-white/[0.03] backdrop-blur-2xl border border-white/10 rounded-3xl p-8 shadow-2xl relative z-10 animate-fade-in-up">
    
    <!-- Top Branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 shadow-lg shadow-blue-500/25 mb-4">
        <span class="text-2xl font-black text-white tracking-widest">S</span>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight" style="font-family:'Space Grotesk',sans-serif">
        Stakes
      </h1>
      <p class="text-xs font-medium text-gray-400 mt-1">Gestión Inteligente de Apuestas & Banca</p>
    </div>

    <!-- Error Alert -->
    @if (errorMessage) {
      <div class="mb-6 p-3.5 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center text-red-400 text-xs font-semibold animate-shake">
        <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Username -->
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Usuario</label>
        <div class="relative">
          <span class="absolute left-4 top-3.5 text-gray-500 text-sm">👤</span>
          <input type="text" [(ngModel)]="username" name="username" required autocomplete="username" placeholder="Ingresa tu usuario"
            class="w-full bg-white/5 border border-white/10 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl text-white text-sm pl-11 pr-4 py-3 outline-none transition-all placeholder-gray-600">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Contraseña</label>
        <div class="relative">
          <span class="absolute left-4 top-3.5 text-gray-500 text-sm">🔒</span>
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required autocomplete="current-password" placeholder="••••••••"
            class="w-full bg-white/5 border border-white/10 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl text-white text-sm pl-11 pr-11 py-3 outline-none transition-all placeholder-gray-600">
          
          <button type="button" (click)="toggleShowPassword()" class="absolute right-3.5 top-3.5 text-gray-500 hover:text-gray-300 text-xs transition-colors">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="isLoading"
        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm py-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition-all hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 flex items-center justify-center space-x-2">
        @if (isLoading) {
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Accediendo...</span>
        } @else {
          <span>Iniciar Sesión</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        }
      </button>
    </form>

    <div class="mt-8 text-center border-t border-white/5 pt-4">
      <p class="text-[11px] text-gray-600 font-medium">Stakes Analytics &copy; 2026. Acceso Protegido.</p>
    </div>

  </div>
</div>
