<div class="p-6 h-full flex flex-col">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-white">Calendario de Eventos</h2>
    <button (click)="openAddModal()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg transition-colors flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Añadir Partido
    </button>
  </div>

  <!-- Header / Filters -->
  <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-6 flex flex-wrap gap-4 items-center justify-between">
    <div class="flex items-center gap-4">
      <button (click)="changeWeek(-1)" class="p-2 bg-gray-900 rounded-lg text-gray-400 hover:text-white border border-gray-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="text-white font-medium">
        {{weekStart | date:'MMM d'}} - {{weekEnd | date:'MMM d, yyyy'}}
      </div>
      <button (click)="changeWeek(1)" class="p-2 bg-gray-900 rounded-lg text-gray-400 hover:text-white border border-gray-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-gray-400 text-sm">Filtro:</span>
      <select [(ngModel)]="selectedLeagueId" (change)="loadData()" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-white text-sm outline-none focus:border-emerald-500">
        <option [ngValue]="undefined">Todas las Ligas</option>
        <option *ngFor="let l of leagues" [ngValue]="l.id">{{l.sport.icon}} {{l.name}}</option>
      </select>
    </div>
  </div>

  <!-- Grid -->
  <div class="flex-1 overflow-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      
      <div *ngFor="let event of events" class="bg-gray-800 rounded-xl border border-gray-700 p-4 relative group">
        <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">
          <button (click)="deleteEvent(event.id!)" class="text-gray-500 hover:text-red-400" title="Eliminar evento">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>

        <div class="flex items-center gap-2 mb-3">
          <span class="text-lg">{{event.league.sport.icon}}</span>
          <span class="text-xs font-medium text-emerald-400/80 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">
            {{event.league.name}}
          </span>
        </div>

        <div class="text-center my-4">
          <div class="text-lg font-bold text-white">{{event.homeTeam}}</div>
          <div class="text-xs font-bold text-gray-500 my-1">VS</div>
          <div class="text-lg font-bold text-white">{{event.awayTeam}}</div>
        </div>

        <div class="mt-4 pt-3 border-t border-gray-700/50 flex justify-center items-center text-sm text-gray-400 font-medium">
          <svg class="w-3.5 h-3.5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          {{formatDate(event.eventDate)}}
        </div>
      </div>

    </div>

    <div *ngIf="events.length === 0" class="text-center py-12 text-gray-500 flex flex-col items-center">
      <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <p>No hay partidos programados para esta semana.</p>
    </div>
  </div>
</div>

<!-- Add Modal -->
<div *ngIf="showAddModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="bg-gray-800 rounded-2xl w-full max-w-md border border-gray-700 overflow-hidden shadow-2xl">
    <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
      <h3 class="text-lg font-bold text-white">Registrar Partido</h3>
      <button (click)="showAddModal = false" class="text-gray-400 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    
    <div class="p-6 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1">Deporte</label>
          <select [(ngModel)]="selectedSportId" (change)="onSportChange()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none">
            <option [ngValue]="undefined">Selecciona...</option>
            <option *ngFor="let s of sports" [ngValue]="s.id">{{s.icon}} {{s.name}}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Liga / Competición</label>
          <select [(ngModel)]="newEvent.league" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none" [disabled]="!selectedSportId">
            <option [ngValue]="undefined">Selecciona...</option>
            <option *ngFor="let l of filteredLeagues" [ngValue]="l">{{l.name}}</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Equipo Local</label>
        <input type="text" [(ngModel)]="newEvent.homeTeam" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none">
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Equipo Visitante</label>
        <input type="text" [(ngModel)]="newEvent.awayTeam" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none">
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Fecha y Hora</label>
        <input type="datetime-local" [(ngModel)]="newEvent.eventDate" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:border-emerald-500 outline-none" [style.color-scheme]="'dark'">
      </div>
    </div>
    
    <div class="p-4 border-t border-gray-700 bg-gray-800/50 flex gap-3 justify-end">
      <button (click)="showAddModal = false" class="px-5 py-2 rounded-xl text-gray-400 hover:text-white font-medium transition-colors">
        Cancelar
      </button>
      <button (click)="saveEvent()" [disabled]="!newEvent.homeTeam || !newEvent.awayTeam || !newEvent.league || !newEvent.eventDate" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl font-medium transition-colors shadow-lg shadow-emerald-500/20">
        Guardar Evento
      </button>
    </div>
  </div>
</div>
