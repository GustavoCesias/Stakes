<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 overflow-y-auto">
  <div class="bg-[#0f172a] rounded-2xl w-full max-w-lg border border-gray-700 shadow-2xl relative my-8">
    <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-gray-800/30 rounded-t-2xl">
      <h3 class="text-xl font-bold text-white flex items-center gap-2">
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Registrar Partido
      </h3>
      <button type="button" (click)="close.emit()" class="text-gray-400 hover:text-white transition-colors bg-gray-800/50 hover:bg-gray-700 p-2 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    
    <div class="p-6">
      <form (ngSubmit)="saveEvent()" class="space-y-5">
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wide">Deporte</label>
            <select [(ngModel)]="sportName" (change)="onSportChange()" name="sportName" class="block w-full bg-slate-800 border border-white/10 focus:border-emerald-500 rounded-lg text-white px-3 py-2 text-sm outline-none transition-all">
              <option value="">Selecciona...</option>
              <option *ngFor="let s of sports" [value]="s.name">{{ s.name }}</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wide">Liga</label>
            <select [(ngModel)]="leagueName" name="leagueName" class="block w-full bg-slate-800 border border-white/10 focus:border-emerald-500 rounded-lg text-white px-3 py-2 text-sm outline-none transition-all">
              <option value="">Selecciona...</option>
              <option *ngFor="let l of filteredLeagues" [value]="l.name">{{ l.name }}</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 items-center">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wide">Equipo Local</label>
            <input type="text" [(ngModel)]="newEvent.homeTeam" name="homeTeam" placeholder="Ej. Real Madrid" class="block w-full bg-slate-800 border border-white/10 focus:border-emerald-500 rounded-lg text-white px-3 py-2 text-sm outline-none transition-all">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wide">Equipo Visitante</label>
            <input type="text" [(ngModel)]="newEvent.awayTeam" name="awayTeam" placeholder="Ej. Barcelona" class="block w-full bg-slate-800 border border-white/10 focus:border-emerald-500 rounded-lg text-white px-3 py-2 text-sm outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wide">Fecha</label>
          <input type="date" [(ngModel)]="newEvent.eventDate" name="eventDate" required class="block w-full bg-slate-800 border border-white/10 focus:border-emerald-500 rounded-lg text-white px-4 py-2 text-sm outline-none transition-all">
        </div>

        <div class="pt-4 flex space-x-3">
          <button type="button" (click)="close.emit()" class="w-1/2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-2.5 rounded-xl transition-all border border-gray-700">Cancelar</button>
          <button type="submit" class="w-1/2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-emerald-500/25 transition-all">
            Guardar Partido
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
